<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Compare three joint-net demos using the project solver or PhysX in Bevy WebAssembly."
    />
    <title>M-ABD and PhysX Comparison</title>
    <link data-trunk rel="rust" data-cargo-no-default-features="false" />
    <link
      data-trunk
      rel="copy-file"
      href="node_modules/physx-js-webidl/physx-js-webidl.mjs"
    />
    <link
      data-trunk
      rel="copy-file"
      href="node_modules/physx-js-webidl/physx-js-webidl.wasm"
    />
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #04060b;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        display: grid;
        place-items: stretch;
      }

      #bevy-canvas {
        width: 100%;
        height: 100%;
        display: block;
        outline: none;
        touch-action: none;
      }

      .label {
        position: fixed;
        top: 1rem;
        left: 1rem;
        z-index: 1;
        margin: 0;
        padding: 0.55rem 0.75rem;
        border: 1px solid rgb(255 255 255 / 12%);
        border-radius: 0.65rem;
        color: rgb(255 255 255 / 75%);
        background: rgb(4 6 11 / 65%);
        backdrop-filter: blur(8px);
        font-size: 0.8rem;
        letter-spacing: 0.04em;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <p class="label">M-ABD | PHYSX COMPARISON</p>
    <canvas id="bevy-canvas" tabindex="0"></canvas>
  </body>
</html>
