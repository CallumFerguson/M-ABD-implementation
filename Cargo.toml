[package]
name = "m-abd-joint-net"
version = "0.1.0"
edition = "2024"
description = "A scalable M-ABD and PhysX ball-joint net comparison for native and web"

[features]
# Native PhysX is intentionally opt-in: physx-sys builds the entire C++ SDK.
# The browser backend remains available because it loads the prebuilt JS/Wasm package.
default = []
native-physx = ["dep:physx", "dep:physx-sys"]

[dependencies]
bevy = { version = "0.19", default-features = false, features = [
    "std",
    "async_executor",
    "bevy_log",
    "bevy_winit",
    "bevy_pbr",
    "bevy_ui_render",
    "default_font",
    "tonemapping_luts",
    "zstd_rust",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { version = "0.19", default-features = false, features = [
    "multi_threaded",
    "x11",
    "wayland",
] }
physx = { version = "0.19", optional = true }
physx-sys = { version = "0.11.5", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.19", default-features = false, features = ["webgl2"] }
js-sys = "0.3"
wasm-bindgen = "0.2"

# Keep development builds responsive while still compiling this crate quickly.
[profile.dev]
opt-level = 1
debug = 1

[profile.dev.package."*"]
opt-level = 1
debug = false

# Favor fast solver code and practical edit-build turnaround for native and browser builds.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 8
strip = "debuginfo"

# Keep an explicit final-build profile for measuring the maximum benefit from
# whole-program optimization without imposing its cost on every release build.
[profile.max-performance]
inherits = "release"
lto = "fat"
codegen-units = 1
