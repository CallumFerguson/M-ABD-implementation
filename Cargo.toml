[package]
name = "m-abd-joint-net"
version = "0.1.0"
edition = "2024"
description = "A minimal M-ABD and PhysX 10x10 ball-joint net comparison for native and web"

[dependencies]
bevy = "0.19"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
physx = "0.19"
physx-sys = "0.11.5"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"

# Keep development builds responsive while still compiling this crate quickly.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Keep distributable native and browser builds compact.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "debuginfo"
